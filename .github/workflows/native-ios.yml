name: Native iOS build
on:
  pull_request:
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.png'
      - '*.webmanifest'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'native/**'
      - 'scripts/**'
      - '.github/workflows/native-ios.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install CocoaPods
        run: gem install cocoapods -v 1.16.2 --no-document
      - name: Install JavaScript dependencies
        run: npm install
      - name: Expose generated dependency lock for review
        run: node -e 'process.stdout.write("RIDE_GARAGE_LOCK=" + JSON.stringify(require("./package-lock.json")) + "\n")'
      - name: Test durable native journal
        run: npm run test:journal
      - name: Generate configured iOS app
        run: npm run ios:init
      - name: Record Xcode version
        run: xcodebuild -version
      - name: Compile app and native recorder without signing
        run: >-
          xcodebuild
          -workspace ios/App/App.xcworkspace
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .native-build
          CODE_SIGNING_ALLOWED=NO
          build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-build-manifests
          path: |
            package-lock.json
            ios/App/Podfile.lock
            ios/App/App/Info.plist
            ios/App/App/capacitor.config.json
