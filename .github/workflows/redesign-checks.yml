name: Redesign browser checks
on:
  pull_request:
    paths:
      - 'index.html'
      - '*.css'
      - '*.js'
      - 'tests/**'
      - '.github/workflows/redesign-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Test saved records and mobile shell
        run: node tests/redesign.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redesign-screenshots
          path: test-results/
