name: Render Ride Garage launch video
on:
  push:
    branches: ['media/ride-garage-launch-short']
    paths:
      - '.github/workflows/render-promo.yml'
      - 'media/launch/hero.png'
      - 'media/launch/capture.cjs'
      - 'media/launch/render.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow==11.2.1 numpy==2.2.5
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
          ffmpeg -version
      - name: Capture demo app screens
        run: node media/launch/capture.cjs
      - name: Render and validate shareable video
        run: python media/launch/render.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ride-garage-launch-pack
          path: media/launch/exports/
          retention-days: 30
      - name: Publish downloadable media on this media branch only
        if: success()
        run: |
          test "$GITHUB_REF" = "refs/heads/media/ride-garage-launch-short"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/launch/exports/
          if ! git diff --cached --quiet; then
            git commit -m "Export Ride Garage launch Short, cover and caption"
            git push origin HEAD:refs/heads/media/ride-garage-launch-short
          fi
