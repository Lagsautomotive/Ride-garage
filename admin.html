<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d3b47e"><title>Ride Garage | Private Admin</title><link rel="icon" href="icon-192.png"><script src="config.js"></script><style>
:root{color-scheme:dark;font:16px/1.55 system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f6f6f6}main{max-width:1050px;margin:auto;padding:25px 18px 80px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #383b43;padding-bottom:20px}header a{color:#ffa365}h1{margin:24px 0 8px;font-size:clamp(28px,6vw,42px)}p{color:#b1b4bd}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:23px 0}.stat{padding:18px;background:#181a20;border:1px solid #32343a;border-radius:15px}.stat b{display:block;color:#ff7b20;font-size:27px}.stat span{font-size:13px;color:#b8b8c2}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:20px 0}select,button{font:inherit;border-radius:9px;padding:10px;background:#22252b;color:#fff;border:1px solid #565a61}button{cursor:pointer}button.primary{background:#d3b47e;color:#0a0a0a;font-weight:800;border-color:#d3b47e}.item{background:#17191f;padding:19px;border:1px solid #393b42;border-radius:14px;margin:12px 0}.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:#adafbb;font-size:13px}.tag{background:#d3b47e20;color:#ffab70;padding:3px 9px;border-radius:30px}.message{white-space:pre-wrap;overflow-wrap:anywhere;color:#eee}.item footer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}.item footer label{color:#bbb;font-size:14px}.hidden{display:none}#notice{color:#f9bc80}@media(max-width:600px){.cards{grid-template-columns:repeat(2,1fr)}.controls select,.controls button{flex:1}}</style><link rel="stylesheet" href="premium.css"></head>
<body class="rg-admin"><main><header><strong>🏍️ RIDE GARAGE <span style="color:#d3b47e">/ ADMIN</span></strong><a href="index.html">Return to app</a></header><h1>Beta Feedback</h1><p>Private rider reports and feature requests. Access is controlled by Supabase security policies, not just this page.</p><p id="notice" role="status" aria-live="polite">Checking admin access…</p><div id="dashboard" class="hidden">
<div class="cards"><div class="stat"><b id="total">0</b><span>Total</span></div><div class="stat"><b id="newCount">0</b><span>New</span></div><div class="stat"><b id="progressCount">0</b><span>In progress</span></div><div class="stat"><b id="resolvedCount">0</b><span>Resolved</span></div></div>
<div class="controls"><label for="filter">Filter</label><select id="filter"><option value="all">All feedback</option><option value="new">New</option><option value="in_progress">In progress</option><option value="resolved">Resolved</option></select><button class="primary" id="refresh">Refresh</button></div>
<div id="items"></div><p id="moreNote"></p></div></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.4';
const cfg=window.RG_CONFIG||{},notice=document.getElementById('notice'),dashboard=document.getElementById('dashboard'),items=document.getElementById('items');
let sb=null,records=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){
  for(const [id,count] of [['total',records.length],['newCount',records.filter(x=>x.status==='new').length],['progressCount',records.filter(x=>x.status==='in_progress').length],['resolvedCount',records.filter(x=>x.status==='resolved').length]])document.getElementById(id).textContent=count;
  const filter=document.getElementById('filter').value;const visible=records.filter(x=>filter==='all'||x.status===filter);
  items.innerHTML=visible.length?visible.map(x=>'<article class="item" data-id="'+esc(x.id)+'"><div class="meta"><span class="tag">'+esc(x.category)+'</span><span>'+esc(new Date(x.created_at).toLocaleString())+'</span><span>Rider '+esc(x.user_id.slice(0,8))+'…</span></div><p class="message">'+esc(x.message)+'</p><footer><label>Status</label><select data-status="'+esc(x.id)+'"><option value="new"'+(x.status==='new'?' selected':'')+'>New</option><option value="in_progress"'+(x.status==='in_progress'?' selected':'')+'>In progress</option><option value="resolved"'+(x.status==='resolved'?' selected':'')+'>Resolved</option></select><span id="result-'+esc(x.id)+'"></span></footer></article>').join(''):'<p>No feedback in this category yet.</p>';
  items.querySelectorAll('select[data-status]').forEach(el=>el.addEventListener('change',async()=>{
    const id=el.dataset.status,original=records.find(x=>x.id===id),previous=original.status;el.disabled=true;
    const {error}=await sb.from('beta_feedback').update({status:el.value}).eq('id',id);
    if(error){el.value=previous;notice.textContent='Update failed. Check admin permission and try again.';}else{original.status=el.value;notice.textContent='Feedback status saved.';render();}el.disabled=false;
  }));
}
async function refresh(){
 notice.textContent='Loading feedback…';
 const {data,error}=await sb.from('beta_feedback').select('id,user_id,category,message,created_at,status').order('created_at',{ascending:false}).limit(500);
 if(error){notice.textContent='Could not read feedback. Check your admin permission and SQL setup.';return;}
 records=data||[];dashboard.classList.remove('hidden');document.getElementById('moreNote').textContent=records.length===500?'Showing latest 500 submissions. Older submissions can be reviewed in Supabase.':'';notice.textContent=records.length+' submission(s) loaded.';render();
}
document.getElementById('filter').addEventListener('change',render);document.getElementById('refresh').addEventListener('click',refresh);
try{
 if(!cfg.SUPABASE_URL||!cfg.SUPABASE_KEY)throw Error('Missing configuration');
 sb=createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY);
 const {data:userData,error:userError}=await sb.auth.getUser();
 if(userError||!userData.user){notice.innerHTML='Please <a href="index.html">sign in to Ride Garage Social</a> first.';}
 else{
  const {data,error}=await sb.rpc('is_ride_garage_admin');
  if(error||data!==true)notice.textContent='Access denied. This page is available only to the Ride Garage admin account.';
  else await refresh();
 }
}catch(e){notice.textContent='Could not connect. Check your connection and try again.';}
</script></body></html>
